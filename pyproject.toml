[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retailassist"
version = "1.0.0"
description = "Local, API-driven e-commerce customer-service copilot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.42,<2",
  "torch>=2.6,<3", "transformers>=4.51,<5", "datasets>=3,<5",
  "accelerate>=1,<2", "sentence-transformers>=4,<6",
  "numpy>=2,<3", "pandas>=2,<3", "scikit-learn>=1.6,<2",
  "pypdf>=5,<7", "requests>=2.32,<3", "httpx>=0.28,<1",
  "matplotlib>=3.10,<4", "python-docx>=1.1,<2", "reportlab>=4.3,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "playwright>=1.50,<2", "imageio-ffmpeg>=0.6,<1"]

[project.scripts]
retailassist = "retailassist.cli:main"

[tool.setuptools.packages.find]
include = ["retailassist*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

